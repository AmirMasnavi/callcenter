server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The build pre-compresses everything, so nginx serves the .gz straight from disk: better
  # compression than it would manage per-request, and no CPU spent on it. gzip stays on as the
  # fallback for anything without a pre-built .gz — notably the proxied API responses below.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss text/javascript image/svg+xml application/manifest+json;

  # Hashed filenames change whenever their content does, so they can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # index.html must NEVER be cached. It is the map to the hashed chunks, and a stale copy
  # points at files the last deploy deleted — a blank screen for anyone still holding it.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # No security-headers include here: Spring Security already sets them on API responses,
  # and adding nginx's copy just duplicates every one of them.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Building an export over a long range can take a while; the default 60s is tight for it.
    proxy_read_timeout 120s;
    # Spreadsheets stream out; buffering them to disk first only adds latency.
    proxy_buffering off;
  }

  location /actuator/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  server_tokens off;
  client_max_body_size 4m;   # avatars are capped at 2 MB; this leaves room for the envelope
}
