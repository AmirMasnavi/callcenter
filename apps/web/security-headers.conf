# Included into EVERY location, not just the server block.
#
# nginx's add_header does not inherit: the moment a location declares one of its own, every
# add_header from the enclosing scope is dropped for that location. Since each location here
# sets its own Cache-Control, the security headers have to come along explicitly — which is
# why this is a snippet rather than four copies that drift apart.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
